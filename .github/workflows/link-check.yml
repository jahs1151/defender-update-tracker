name: Link check

on:
  schedule:
    - cron: "40 6 * * 1"   # Mondays 06:40 UTC
  pull_request:
    paths: ["site/data/features.json", "site/data/curated.json", "scripts/check-links.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links and OMA-URIs
        id: check
        run: node scripts/check-links.mjs
        continue-on-error: true
      - name: Save the report so the page hides broken hand-kept entries
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/link-report.json
          git diff --cached --quiet || { git commit -m "Link check $(date -u +%Y-%m-%d)"; git pull --rebase origin main && git push origin HEAD:main; }
      - name: Fail when something is broken
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Broken links. See the step log and site/data/link-report.json."
          exit 1
