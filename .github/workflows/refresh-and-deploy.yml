name: Refresh data and deploy

on:
  schedule:
    - cron: "17 * * * *"        # hourly
    - cron: "2,32,47 * 8-15 * *" # extra runs (every 15 min with the hourly one) in Patch Tuesday week; gated below
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether to collect
        id: gate
        run: |
          collect=true
          if [ "${{ github.event_name }}" = "push" ]; then collect=false; fi
          # The extra 15-minute schedule only matters on Patch Tuesday and the day after (UTC).
          if [ "${{ github.event.schedule }}" = "2,32,47 * 8-15 * *" ]; then
            dow=$(date -u +%u)   # 2 = Tuesday, 3 = Wednesday
            dom=$(date -u +%-d)
            if ! { [ "$dow" = 2 ] && [ "$dom" -ge 8 ] && [ "$dom" -le 14 ]; } && ! { [ "$dow" = 3 ] && [ "$dom" -ge 9 ] && [ "$dom" -le 15 ]; }; then
              echo "Not Patch Tuesday week. Skipping this extra run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: steps.gate.outputs.skip != 'true'
        run: npm test

      - name: Collect public sources
        id: collect
        if: steps.gate.outputs.collect == 'true'
        run: node scripts/collect.mjs

      - name: Commit data when content changed
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data/pulse.json site/data/changelog
          git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      - name: Upload site
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
