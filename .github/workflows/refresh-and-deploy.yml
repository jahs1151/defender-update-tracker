name: Refresh data and deploy

on:
  schedule:
    - cron: "17 * * * *"        # hourly
    - cron: "2,32,47 * 8-15 * *" # extra runs (every 15 min with the hourly one) in Patch Tuesday week; gated below
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide whether to collect
        id: gate
        run: |
          collect=true
          if [ "${{ github.event_name }}" = "push" ]; then collect=false; fi
          # The extra 15-minute schedule only matters on Patch Tuesday and the day after (UTC).
          if [ "${{ github.event.schedule }}" = "2,32,47 * 8-15 * *" ]; then
            dow=$(date -u +%u)   # 2 = Tuesday, 3 = Wednesday
            dom=$(date -u +%-d)
            if ! { [ "$dow" = 2 ] && [ "$dom" -ge 8 ] && [ "$dom" -le 14 ]; } && ! { [ "$dow" = 3 ] && [ "$dom" -ge 9 ] && [ "$dom" -le 15 ]; }; then
              echo "Not Patch Tuesday week. Skipping this extra run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: steps.gate.outputs.skip != 'true'
        run: npm test

      - name: Collect public sources
        id: collect
        if: steps.gate.outputs.collect == 'true'
        # VirusTotal hash lookups. Set the repository secret VIRUSTOTAL_API_KEY to turn them on.
        # The key is read from the environment only; it is never printed or written to the data files.
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node scripts/collect.mjs

      # Microsoft's threat catalog, saved as static shards for the "Find a detection" box (the browser cannot call
      # Microsoft's search directly). Each run walks a few more minutes until the catalog is complete, then only
      # looks up new changelog names, and repeats the whole walk every 30 days. A failure here never stops the refresh.
      - name: Threat catalog index
        if: steps.gate.outputs.collect == 'true'
        continue-on-error: true
        run: node scripts/catalog.mjs --minutes 5 --families

      - name: Commit data when content, lookup caches or the catalog changed
        if: steps.gate.outputs.collect == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pulse.json carries a fresh timestamp every run, so it is committed only when content or lookup caches changed.
          if [ "${{ steps.collect.outputs.changed }}" = "true" ] || [ "${{ steps.collect.outputs.state }}" = "true" ]; then
            git add -A site/data/pulse.json site/data/changelog site/data/families.json site/data/detections.json site/data/changes.json site/feed.xml
          fi
          git add -A site/data/catalog
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && break
            sleep $((i * 5))
          done

      # Posts this run's "What changed" lines to Teams, Slack or any JSON webhook.
      # Set the repository secret ALERT_WEBHOOK_URL to turn it on; without it this step does nothing.
      - name: Send change alert
        if: steps.collect.outputs.changed == 'true'
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/notify.mjs

      # Cache busting: phones keep old CSS and JS for a while, so each deploy gets its own asset URLs.
      - name: Stamp asset versions
        if: steps.gate.outputs.skip != 'true'
        run: sed -i "s/__V__/$(git rev-parse --short HEAD)-${{ github.run_number }}/g" site/index.html

      - name: Upload site
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
